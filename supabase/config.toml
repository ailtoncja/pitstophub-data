# Configuracao minima do Supabase CLI para as Edge Functions deste repositorio.
# As funcoes tem autenticacao propria (SYNC_SECRET / sessao do admin conferida
# na propria funcao), por isso nao exigem o JWT do Supabase.

[functions.sync]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.backup]
verify_jwt = false
